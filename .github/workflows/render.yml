name: Render Video Pipeline (30 FPS)

on:
  workflow_dispatch:
    inputs:
      quality:
        description: 'Render Quality'
        required: true
        default: 'high'
        type: choice
        options:
          - 'high'
          - 'standard'
          - 'draft'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: 4. Ensure Headless Browser Binaries
        run: npx hyperframes browser ensure

      - name: 5. Render Act 1 - Intro Hook (27s @ 30 FPS)
        run: |
          mkdir -p renders
          echo "🎬 [1/3] Rendering Intro..."
          npx hyperframes render compositions/intro.html --output renders/intro.mp4 --quality ${{ github.event.inputs.quality || 'high' }} --fps 30

      - name: 6. Render Act 2 - Part 1 Primitives (115s @ 30 FPS)
        run: |
          echo "🎬 [2/3] Rendering Part 1..."
          npx hyperframes render compositions/part1.html --output renders/part1.mp4 --quality ${{ github.event.inputs.quality || 'high' }} --fps 30

      - name: 7. Render Act 3 - Part 2 Arena & Verdict (118s @ 30 FPS)
        run: |
          echo "🎬 [3/3] Rendering Part 2..."
          npx hyperframes render compositions/part2.html --output renders/part2.mp4 --quality ${{ github.event.inputs.quality || 'high' }} --fps 30

      - name: 8. Stitch All 3 Acts into Complete Video (Lossless 1s Concat)
        run: |
          echo "⚡ Joining all 3 parts with lossless FFmpeg..."
          cat << 'EOF' > renders/concat.txt
          file 'intro.mp4'
          file 'part1.mp4'
          file 'part2.mp4'
          EOF
          
          ffmpeg -f concat -safe 0 -i renders/concat.txt -c copy renders/gemini_4_argon_complete_30fps.mp4
          echo "✅ Full 260s video created: renders/gemini_4_argon_complete_30fps.mp4"

      - name: 9. Upload Finished Videos
        uses: actions/upload-artifact@v4
        with:
          name: gemini-4-argon-30fps
          path: renders/*.mp4
          retention-days: 7
